name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: prism365_ci
          POSTGRES_USER: postgres
          # Public fixture password for this disposable service, never a production secret.
          POSTGRES_PASSWORD: prism365_ci_synthetic_password_12345
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d prism365_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_ADMIN_URL: postgresql://postgres:prism365_ci_synthetic_password_12345@127.0.0.1:5432/prism365_ci
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run repository checks
        run: npm run check
      - name: Build applications and packages
        run: npm run build
      - name: Build self-host container image
        run: docker build --tag prism365:ci .
      - name: Smoke test the self-hosted UI and API
        run: |
          docker run --detach --name prism365-ci-smoke --publish 127.0.0.1:8080:8787 prism365:ci
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 1 --connect-timeout 2 --max-time 3 --retry-max-time 30 http://127.0.0.1:8080/health
          curl --fail http://127.0.0.1:8080/api/v1/session
          curl --fail --output /dev/null http://127.0.0.1:8080/
      - name: Show failed smoke-test diagnostics
        if: failure()
        run: docker logs prism365-ci-smoke || true
      - name: Clean up the smoke-test container
        if: always()
        run: docker rm --force prism365-ci-smoke || true
